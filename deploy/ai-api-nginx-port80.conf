# Nginx: port 80 (public) → AI API Node pe 127.0.0.1:3000
# Instalare: sudo cp deploy/ai-api-nginx-port80.conf /etc/nginx/sites-available/ai-api
#           sudo ln -s /etc/nginx/sites-available/ai-api /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Înlocuiește ai.example.com cu domeniul tău sau lasă _ pentru IP direct.
# După ce merge HTTP, adaugă TLS: certbot --nginx -d ai.example.com

server {
    listen 80;
    listen [::]:80;
    server_name ai.example.com;

    access_log /var/log/nginx/ai-api-access.log;
    error_log  /var/log/nginx/ai-api-error.log;

    client_max_body_size 2m;

    location /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Păstrează antetele de autentificare către aplicația Node
        proxy_set_header Authorization $http_authorization;
        proxy_set_header x-api-key $http_x_api_key;

        # LLM / streaming: timeout-uri mari
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering off pentru SSE (dacă activezi stream)
        proxy_buffering off;
    }
}
