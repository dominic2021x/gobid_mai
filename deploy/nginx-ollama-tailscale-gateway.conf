# =============================================================================
# VPS Nginx → Ollama pe Mac mini (Tailscale)
# =============================================================================
# 1) Înlocuiește MAC_MINI_TAILSCALE_IP (ex. 100.64.x.y) cu IP-ul din `tailscale ip -4` pe Mac mini.
# 2) Înlocuiește YOUR_GATEWAY_SECRET cu același string ca AI_GATEWAY_API_KEY / MAC_MINI_API_KEY în Vercel.
# 3) În nginx.conf, în blocul http { }, adaugă (o singură dată):
#    limit_req_zone $binary_remote_addr zone=ollama_gw:10m rate=10r/s;
# 4) sudo nginx -t && sudo systemctl reload nginx
#
# Mac mini (24GB, Metal): Ollama folosește Metal implicit. Recomandat:
#   export OLLAMA_MAX_LOADED_MODELS=1
#   export OLLAMA_NUM_PARALLEL=1
# Modele: ollama pull gemma:7b mistral:7b-instruct mixtral:8x7b llama3:8b nomic-embed-text
# (Tag-urile exacte pot varia; aliniază cu AI_GATEWAY_MODEL_* din .env.)
#
# TLS: după ce merge pe 80, folosește certbot --nginx -d ai.domeniu.tău
# =============================================================================

upstream ollama_macmini {
    zone ollama_macmini_upstream 64k;
    # Înlocuiește cu IP-ul Tailscale al Mac mini (ex. 100.64.x.y), nu hostname public.
    server 127.0.0.1:11434;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.example.com;

    access_log /var/log/nginx/ollama-gw-access.log;
    error_log  /var/log/nginx/ollama-gw-error.log;

    client_max_body_size 8m;

    set $auth_ok 0;
    if ($http_authorization = "Bearer YOUR_GATEWAY_SECRET") {
        set $auth_ok 1;
    }
    if ($http_x_api_key = "YOUR_GATEWAY_SECRET") {
        set $auth_ok 1;
    }
    if ($auth_ok = 0) {
        return 401;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/api/(chat|generate|embeddings|tags) {
        limit_req zone=ollama_gw burst=20 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
        proxy_cache off;

        proxy_pass http://ollama_macmini;
    }

    location / {
        return 404;
    }
}
