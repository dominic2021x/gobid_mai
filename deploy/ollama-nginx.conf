# For /etc/nginx/conf.d/ollama.conf
# 1) Add the rate-limit zone in /etc/nginx/nginx.conf inside http { }:
#    limit_req_zone $binary_remote_addr zone=ollama_rl:10m rate=10r/s;
# 2) Replace YOUR_STRONG_TOKEN_HERE with a strong secret.

server {
  listen 8081;
  server_name _;

  access_log off;
  client_max_body_size 2m;

  location = /health {
    return 200 "ok";
  }

  set $ok 0;
  if ($http_authorization = "Bearer YOUR_STRONG_TOKEN_HERE") { set $ok 1; }
  if ($ok = 0) { return 401; }

  location /api/chat {
    limit_req zone=ollama_rl burst=20 nodelay;

    if ($request_method != POST) { return 405; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_pass http://127.0.0.1:11434/api/chat;
  }
}
